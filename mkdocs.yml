# Site name
site_name: Module 3 - Databases and SQL
site_url: https://qaalabs.github.io/DA4M3G/
dev_addr: '0.0.0.0:8000'

# Navigation menu
nav:
  - Overview: index.md
  - Module KSBs: ksb.md

  - Agenda:
    - Topics: agenda/index.md
    - Day 3: agenda/day3.md

  - "Day 3 - SQL 1":
    - "Database Types Investigation": day3/db-types.md
    - "Local Yesterday - Cloud Today": day3/framing.md
    - "GCP & BigQuery Orientation": day3/gcp-logon.md
    - "Explore ECommerce Dataset": day3/bigquery-explore.md
    - "Run ECommerce Queries": day3/bigquery-queries.md
    - "Write BigQuery SQL - Task 1": day3/bigquery-tasks-1.md
    - "Write BigQuery SQL - Task 2": day3/bigquery-tasks-2.md
    - "Write BigQuery SQL - Task 3": day3/bigquery-tasks-3.md
    - "Google Cloud Debrief": day3/bigquery-solutions.md

  - Resources: resources.md

not_in_nav: |
  404.md
  trainer.md
  google/GCPFCI.md
  google/GCPMDLDW.md


# Theme
theme:
    features:
      - toc.integrate
      - content.code.copy
    name: material
    icon:
      logo: material/database

# Extensions
markdown_extensions:
  - admonition
  - attr_list
  - codehilite:
      guess_lang: false
  - def_list
  - footnotes
  - meta
  - tables
  - toc:
      permalink: false
      toc_depth: 2

  - pymdownx.arithmatex
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      repo_url_shorthand: true
      user: squidfunk
      repo: mkdocs-material
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed
  - pymdownx.tasklist:
      custom_checkbox: true
      clickable_checkbox: true
  - pymdownx.tilde

plugins:
  - search
  - glightbox
  - mkdocs_quiz

extra_javascript:
  - https://unpkg.com/mermaid/dist/mermaid.min.js


