# Site name
site_name: Module 3 - Databases and SQL
dev_addr: '0.0.0.0:8000'

# Navigation menu
nav:
  - Overview: index.md

  - Agenda:
    - Day 2: agenda/day2.md

  - "Day 2 - GCPFCI 2":
    - "GCP & BigQuery Orientation": day2/gcp-logon.md
    - "Explore ECommerce Dataset": day2/bigquery-explore.md
    - "Run ECommerce Queries": day2/bigquery-queries.md
    - "Write BigQuery SQL - Task 1": day2/bigquery-tasks-1.md
    - "Write BigQuery SQL - Task 2": day2/bigquery-tasks-2.md
    - "Write BigQuery SQL - Task 3": day2/bigquery-tasks-3.md
    - "MongoDB": day2/mongo-db.md

  - Resources: resources.md

not_in_nav: |
  404.md
  trainer.md
  day2/framing.md
  day2/bigquery-solutions.md


# Theme
theme:
    features:
      - toc.integrate
      - content.code.copy
    name: material
    icon:
      logo: material/database

# Extensions
markdown_extensions:
  - admonition
  - attr_list
  - codehilite:
      guess_lang: false
  - def_list
  - footnotes
  - meta
  - tables
  - toc:
      permalink: false
      toc_depth: 2

  - pymdownx.arithmatex
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      repo_url_shorthand: true
      user: squidfunk
      repo: mkdocs-material
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed
  - pymdownx.tasklist:
      custom_checkbox: true
      clickable_checkbox: false
  - pymdownx.tilde

plugins:
  - search
  - glightbox

extra_javascript:
  - https://unpkg.com/mermaid/dist/mermaid.min.js


